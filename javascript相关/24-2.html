<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幻灯片展示 - 230 程柯昕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        /* 幻灯片容器 */
        #cheng_slide {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            margin: 50px auto;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        
        /* 幻灯片图片容器 */
        .cheng_slide-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        /* 单个幻灯片 */
        .cheng_slide-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        /* 当前显示的幻灯片 */
        .cheng_slide-item.active {
            opacity: 1;
            z-index: 1;
        }
        
        /* 幻灯片图片 */
        .cheng_slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* 左右按钮 */
        .cheng_slide-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 鼠标悬停时显示按钮 */
        #cheng_slide:hover .cheng_slide-btn {
            opacity: 1;
        }
        
        /* 左按钮 */
        .cheng_slide-btn.prev {
            left: 20px;
        }
        
        /* 右按钮 */
        .cheng_slide-btn.next {
            right: 20px;
        }
        
        /* 切换点容器 */
        .cheng_slide-dots {
            position: absolute;
            bottom: 20px;
            left: 20px;
            transform: none;
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        
        /* 单个切换点 */
        .cheng_slide-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        /* 当前激活的切换点 */
        .cheng_slide-dot.active {
            width: 16px;
            height: 8px;
            border-radius: 4px;
            background-color: white;
        }
        
        /* 页脚样式 */
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="cheng_slide">
        <div class="cheng_slide-container"></div>
        <button class="cheng_slide-btn prev">←</button>
        <button class="cheng_slide-btn next">→</button>
        <div class="cheng_slide-dots"></div>
    </div>
    
    <footer>
        @copyright 230 程柯昕
    </footer>
    
    <script>
        // 幻灯片功能实现
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const slideContainer = document.querySelector('.cheng_slide-container');
            const dotsContainer = document.querySelector('.cheng_slide-dots');
            const prevBtn = document.querySelector('.cheng_slide-btn.prev');
            const nextBtn = document.querySelector('.cheng_slide-btn.next');
            
            // 模拟数据，用于本地测试
            const mockSlides = [
                { image: '../../images/1.jpg', id: '1' },
                { image: '../../images/2.jpg', id: '2' },
                { image: '../../images/3.jpg', id: '3' },
                { image: '../../images/4.jpg', id: '4' },
                { image: '../../images/5.jpg', id: '5' },
                { image: '../../images/6.jpg', id: '6' }
            ];
            
            let slides = [];
            let currentIndex = 0;
            let slideInterval;
            
            // 初始化幻灯片
            function initSlides() {
                // 清空容器
                slideContainer.innerHTML = '';
                dotsContainer.innerHTML = '';
                
                // 创建幻灯片和切换点
                slides.forEach((slide, index) => {
                    // 创建幻灯片项
                    const slideItem = document.createElement('div');
                    slideItem.className = `cheng_slide-item ${index === 0 ? 'active' : ''}`;
                    slideItem.setAttribute('data-id', slide.id);
                    
                    const img = document.createElement('img');
                    img.src = slide.image;
                    img.alt = `幻灯片 ${index + 1}`;
                    
                    slideItem.appendChild(img);
                    slideContainer.appendChild(slideItem);
                    
                    // 创建切换点
                    const dot = document.createElement('div');
                    dot.className = `cheng_slide-dot ${index === 0 ? 'active' : ''}`;
                    dot.setAttribute('data-index', index);
                    
                    // 点击切换点切换幻灯片
                    dot.addEventListener('click', function() {
                        const targetIndex = parseInt(this.getAttribute('data-index'));
                        showSlide(targetIndex);
                    });
                    
                    dotsContainer.appendChild(dot);
                });
                
                // 启动自动播放
                startAutoPlay();
            }
            
            // 显示指定索引的幻灯片
            function showSlide(index) {
                // 边界检查
                if (index < 0) {
                    index = slides.length - 1;
                } else if (index >= slides.length) {
                    index = 0;
                }
                
                // 更新当前索引
                currentIndex = index;
                
                // 更新幻灯片显示状态
                const slideItems = document.querySelectorAll('.cheng_slide-item');
                slideItems.forEach((item, i) => {
                    if (i === currentIndex) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
                
                // 更新切换点状态
                const dots = document.querySelectorAll('.cheng_slide-dot');
                dots.forEach((dot, i) => {
                    if (i === currentIndex) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            }
            
            // 下一张幻灯片
            function nextSlide() {
                showSlide(currentIndex + 1);
            }
            
            // 上一张幻灯片
            function prevSlide() {
                showSlide(currentIndex - 1);
            }
            
            // 启动自动播放
            function startAutoPlay() {
                // 清除现有的定时器
                if (slideInterval) {
                    clearInterval(slideInterval);
                }
                
                // 设置新的定时器，每3秒切换一次
                slideInterval = setInterval(nextSlide, 3000);
            }
            
            // 暂停自动播放
            function stopAutoPlay() {
                if (slideInterval) {
                    clearInterval(slideInterval);
                }
            }
            
            // 从接口获取数据
            function fetchSlidesFromApi() {
                fetch('http://localhost:3000/slide')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        // 处理返回的数据
                        if (Array.isArray(data) && data.length > 0) {
                            // 为每张图片添加完整路径
                            slides = data.map(item => ({
                                ...item,
                                image: `../../images/${item.image}` // 假设图片都在images目录下
                            }));
                            initSlides();
                        } else {
                            console.warn('API返回的数据为空，使用模拟数据');
                            slides = mockSlides;
                            initSlides();
                        }
                    })
                    .catch(error => {
                        console.error('获取幻灯片数据失败:', error);
                        console.log('使用模拟数据');
                        // 使用模拟数据作为备选
                        slides = mockSlides;
                        initSlides();
                    });
            }
            
            // 添加事件监听器
            prevBtn.addEventListener('click', function() {
                stopAutoPlay();
                prevSlide();
                startAutoPlay();
            });
            
            nextBtn.addEventListener('click', function() {
                stopAutoPlay();
                nextSlide();
                startAutoPlay();
            });
            
            // 鼠标悬停时暂停自动播放
            const slideWrapper = document.getElementById('cheng_slide');
            slideWrapper.addEventListener('mouseenter', stopAutoPlay);
            slideWrapper.addEventListener('mouseleave', startAutoPlay);
            
            // 初始化
            fetchSlidesFromApi();
        });
    </script>
</body>
</html>
