<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>程柯昕：JSON数组解析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f5f5;
        }
        
        .alist {
            /* 调整背景色为白色 */
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
            background-color: #fff;
        }
        
        .alist li {
            flex: 0 0 calc(25% - 10px);
            background-color: #fff;
            padding: 10px 10px;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
            height: 270px;
            overflow: hidden;
        }
        
        .alist li:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .product-image {
            width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 6px;
            background-color: #fff;
        }
        
        .product-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .product-name {
            font-size: 11px;
            line-height: 1.5;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        
        .product-price {
            font-size: 16px;
            font-weight: bold;
            color: #e1251b;
            display: inline-block;
            margin-right: 5px;
        }
        
        .product-sales {
            font-size: 11px;
            color: #999;
            display: inline-block;
            vertical-align: bottom;
            margin-bottom: 2px;
        }
        
        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-bottom: 4px;
        }
        
        .product-tags span {
            font-size: 9px;
            color: #fff;
            background-color: #e1251b;
            padding: 0 3px;
            border-radius: 1px;
            line-height: 1.4;
        }
        
        /* 特定标签样式 */
        .product-tags span:nth-child(2) {
            background-color: #4a90e2;
        }
        
        .product-additional {
            font-size: 10px;
            color: #e1251b;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            margin-top: 3px;
        }
        
        .add-to-cart {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background-color: #e1251b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            font-weight: bold;
        }
        
        .add-to-cart:hover {
            background-color: #ff7a23;
        }
        
        /* 响应式布局调整 */
        @media (max-width: 1024px) {
            .alist li {
                flex: 0 0 calc(33.333% - 10px);
            }
        }
        
        @media (max-width: 768px) {
            .alist li {
                flex: 0 0 calc(50% - 10px);
            }
        }
        
        @media (max-width: 480px) {
            .alist li {
                flex: 0 0 100%;
            }
        }
    </style>
</head>
<body>
    <ul class="alist">
        <!-- 使用本地json数据
        [{"brand": "Apple","productName": "Apple 苹果 iPhone X/8/7/6 系列二手手机 规格见…","price": "¥219.00","salesVolume": "3000+","tags": ["自营", "拍拍二手"],"additionalInfo": "600 元'下拉详询限量大额券'；12 期免息'下拉详询限时免息券'；7 天无理由；买 Apple 二手上拍拍自营","image": "3.jpg"},{"brand": "心相印","productName": "心相印抽纸茶语纸巾面巾纸卫生纸茶叶压花擦手巾母婴适用便携…","price": "¥3.79","salesVolume": "200 万 +","tags": ["京东秒杀", "买贵双倍赔"],"additionalInfo": "365 天最低","image": "4.jpg"},{"brand": "小米","productName": "小米 15 16GB+512GB 新品 5G 手机骁龙 8 至尊版 可选 12 期分期 n…","price": "¥1899.00","salesVolume": "400+","tags": [],"additionalInfo": "","image": "2.jpg"},{"brand": "","productName": "新枣新疆红枣 500g 袋装免洗即食特级若羌灰枣煲汤泡茶特产干果…","price": "¥6.50","salesVolume": "6000+","tags": [],"additionalInfo": "精品和田大枣；今日活动 2 斤","image": "1.jpg"}] 
        根据数据渲染到class=alist的ul标签中,原生代码，自适应宽度
        -->

    </ul>

    <script>
        // 提取注释中的JSON数据
        const jsonData = [
            {
                "brand": "Apple",
                "productName": "Apple 苹果 iPhone X/8/7/6 系列二手手机 规格见…",
                "price": "¥219.00",
                "salesVolume": "3000+",
                "tags": ["自营", "拍拍二手"],
                "additionalInfo": "600 元'下拉详询限量大额券'；12 期免息'下拉详询限时免息券'；7 天无理由；买 Apple 二手上拍拍自营",
                "image": "3.jpg"
            },
            {
                "brand": "心相印",
                "productName": "心相印抽纸茶语纸巾面巾纸卫生纸茶叶压花擦手巾母婴适用便携…",
                "price": "¥3.79",
                "salesVolume": "200 万 +",
                "tags": ["京东秒杀", "买贵双倍赔"],
                "additionalInfo": "365 天最低",
                "image": "4.jpg"
            },
            {
                "brand": "小米",
                "productName": "小米 15 16GB+512GB 新品 5G 手机骁龙 8 至尊版 可选 12 期分期 n…",
                "price": "¥1899.00",
                "salesVolume": "400+",
                "tags": [],
                "additionalInfo": "",
                "image": "2.jpg"
            },
            {
                "brand": "",
                "productName": "新枣新疆红枣 500g 袋装免洗即食特级若羌灰枣煲汤泡茶特产干果…",
                "price": "¥6.50",
                "salesVolume": "6000+",
                "tags": [],
                "additionalInfo": "精品和田大枣；今日活动 2 斤",
                "image": "1.jpg"
            }
        ];

        // 获取alist元素
        const alist = document.querySelector('.alist');

        // 渲染数据到alist
        jsonData.forEach(item => {
            const li = document.createElement('li');
            
            // 构建图片路径，使用../img/相对路径
            const imagePath = `../img/${item.image}`;
            
            // 创建标签HTML
            let tagsHtml = '';
            if (item.tags && item.tags.length > 0) {
                tagsHtml = item.tags.map(tag => `<span>${tag}</span>`).join('');
            }
            
            // 设置li的HTML内容
            li.innerHTML = `
                <img src="${imagePath}" alt="${item.productName}" class="product-image">
                <div class="product-info">
                    ${tagsHtml ? `<div class="product-tags">${tagsHtml}</div>` : ''}
                    <div class="product-name">${item.productName}</div>
                    <div>
                        <span class="product-price">${item.price}</span>
                        <span class="product-sales">销量${item.salesVolume}</span>
                    </div>
                    ${item.additionalInfo ? `<div class="product-additional">${item.additionalInfo}</div>` : ''}
                </div>
                <div class="add-to-cart">+</div>
            `;
            
            // 添加到alist中
            alist.appendChild(li);
        });
    </script>
</body>
</html>
