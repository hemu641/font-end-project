<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>程柯昕：AJAX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            font-size: 28px;
            font-weight: 700;
        }
        
        .alist {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin: 0 auto;
        }
        
        .alist li {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border: 1px solid #eaeaea;
        }
        
        .alist li:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }
        
        .image-container {
            overflow: hidden;
        }
        
        .image-container img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }
        
        .alist li:hover .image-container img {
            transform: scale(1.08);
        }
        
        .content-container {
            padding: 20px;
        }
        
        .content-container h3 {
            margin-bottom: 12px;
            color: #2c3e50;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.3;
        }
        
        .content-container h3 a {
            text-decoration: none;
            color: inherit;
            position: relative;
            transition: color 0.3s ease;
        }
        
        .content-container h3 a:hover {
            color: #667eea;
        }
        
        .content-container h3 a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2px;
            background-color: #667eea;
            transition: width 0.3s ease;
        }
        
        .content-container h3 a:hover::after {
            width: 100%;
        }
        
        .content-container p {
            margin-bottom: 15px;
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .content-container .author {
            font-size: 13px;
            color: #999;
            text-align: right;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
        }
        
        .content-container .author::before {
            content: '📝';
        }
        
        /* 确保在任何宽度下都保持一行两个li，直到达到移动端尺寸 */
        @media (min-width: 768px) {
            .alist {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        
        /* 移动端响应式 */
        @media (max-width: 767px) {
            body {
                padding: 12px;
            }
            
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }
            
            .alist {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .image-container img {
                height: 180px;
            }
            
            .content-container {
                padding: 15px;
            }
            
            .content-container h3 {
                font-size: 18px;
            }
        }
        
        /* 加载动画样式 */
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #666;
        }
        
        .error {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>程柯昕的内容展示</h1>
        <ul class="alist">
            <li class="loading">加载中...</li>
        </ul>
    </div>
    
    <script>
        // 获取ul元素
        const alist = document.querySelector('.alist');
        
        // 定义API URL
        const apiUrl = 'http://rap2api.taobao.org/app/mock/321623/lei';
        
        // 使用fetch API获取数据
        async function fetchData() {
            try {
                // 显示加载状态
                alist.innerHTML = '<li class="loading">加载中...</li>';
                
                // 发送请求
                const response = await fetch(apiUrl);
                
                // 检查响应状态
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // 解析JSON
                const data = await response.json();
                
                // API返回的是直接的数组格式
                const items = Array.isArray(data) ? data : [];
                
                // 如果没有数据
                if (items.length === 0) {
                    alist.innerHTML = '<li class="error">暂无数据</li>';
                    return;
                }
                
                // 渲染数据
                renderData(items);
                
            } catch (error) {
                // 处理错误
                console.error('获取数据失败:', error);
                alist.innerHTML = `<li class="error">获取数据失败: ${error.message}</li>`;
                
                // 由于是模拟环境，可能API无法访问，这里提供与实际API完全匹配的模拟数据
                const mockData = [
                    {
                        image: "1.jpg",
                        link: " `https://example.com/link1` ",
                        title: "标题一",
                        content: "这是第一段内容，里面包含了丰富的中文字符。",
                        author: "作者A"
                    },
                    {
                        image: "2.jpg",
                        link: " `https://example.com/link2` ",
                        title: "标题二",
                        content: "第二段内容讲述了另一个故事，同样使用了中文字符进行描述。",
                        author: "作者B"
                    },
                    {
                        image: "3.jpg",
                        link: " `https://example.com/link3` ",
                        title: "标题三",
                        content: "第三段内容展示了不同的信息，虽然内容不同，但同样都是中文字符。",
                        author: "作者C"
                    },
                    {
                        image: "4.jpg",
                        link: " `https://example.com/link4` ",
                        title: "标题四",
                        content: "第四段内容更加详细，包含了更多的中文字符和细节描述。",
                        author: "作者D"
                    },
                    {
                        image: "5.jpg",
                        link: " `https://example.com/link5` ",
                        title: "标题五",
                        content: "第五段内容聚焦于某个主题，并使用了中文字符来深入阐述。",
                        author: "作者E"
                    },
                    {
                        image: "6.jpg",
                        link: " `https://example.com/link6` ",
                        title: "标题六",
                        content: "最后一段内容以中文字符结束，感谢大家的阅读和支持。",
                        author: "作者F"
                    }
                ];
                
                // 3秒后使用模拟数据
                setTimeout(() => {
                    renderData(mockData);
                }, 1500);
            }
        }
        
        // 渲染数据到页面
        function renderData(items) {
            // 清空ul
            alist.innerHTML = '';
            
            // 遍历数据，创建li元素
            items.forEach(item => {
                const li = document.createElement('li');
                
                // 提取link字段中的实际URL，去除反引号
                const cleanLink = item.link.replace(/`/g, '').trim();
                
                // 确保图片路径正确添加前缀（使用正确的相对路径）
                const imagePath = item.image.includes('http') ? item.image : `../../images/${item.image}`;
                
                // 构建li的内容，包含图片、标题、内容和作者，确保使用清理后的cleanLink
                li.innerHTML = `
                    <div class="image-container">
                        <img src="${imagePath}" alt="${item.title}">
                    </div>
                    <div class="content-container">
                        <h3><a href="${cleanLink}" target="_blank">${item.title}</a></h3>
                        <p>${item.content}</p>
                        <div class="author">—— ${item.author}</div>
                    </div>
                `;
                
                // 添加到ul
                alist.appendChild(li);
            });
        }
        
        // 页面加载时获取数据
        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
