<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列表示例 - 230 程柯昕</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .cheng_main {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .cheng_main h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .cheng_list {
            list-style: none;
            padding-left: 25px;
            margin: 0;
        }
        .cheng_list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 12px;
            line-height: 1.8;
            font-size: 16px;
        }
        .cheng_list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background-image: url('../../images/dot.gif');
            background-repeat: no-repeat;
            background-size: contain;
        }
        .cheng_footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="cheng_main">
        <h1>自定义列表样式</h1>
        <ul class="cheng_list">
            <li>这是列表的第一项内容</li>
            <li>这是列表的第二项内容</li>
            <li>这是列表的第三项内容</li>
            <li>这是列表的第四项内容</li>
            <li>这是列表的第五项内容</li>
        </ul>
    </div>
    
    <footer class="cheng_footer">
        @copyright 230 程柯昕
    </footer>
</body>
</html>
