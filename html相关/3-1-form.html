<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html form表单练习</title>
</head>
<body>
    <h2>html form表单练习</h2>
    <form action="http://huanqiu.com" name="ckx" method="get">
        <p>
            用户名：<input type="text" name="username" placeholder="请输入用户名" required>
        </p>
        <p>
            密码：<input type="password" name="password" placeholder="请输入密码" required>
        </p>
        <p>
            性别：
            <input type="radio" name="sex" value="m">男
            <input type="radio" name="sex" value="f">女
            <input type="radio" name="sex" value="s">保密
        </p>
        <p>
            爱好：
            <input type="checkbox" name="hobby" value="c" checked> coding <!-- checked表示默认选中，规范写法-->
            <input type="checkbox" name="hobby" value="s" checked="checked"> sleeping
            <input type="checkbox" name="hobby" value="w"> watching
        </p>
        <p>
            籍贯：
            <select name="province" id="province">
                <option value="1">辽宁</option>
                <option value="2">吉林</option>
                <option value="3" selected>黑龙江</option>
                <option value="4">河北</option>
                <option value="5">河南</option>
            </select>
        </p>
        <p>
            我的介绍：
            <textarea name="intro" id="intro" cols="20" rows="3"></textarea>
        </p>
        <p>
            <input type="submit" value="提交">
            <input type="reset" value="重置">
            <input type="button" value="按钮">
        </p>
    </form>
</body>
</html>
