<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li{
            list-style: none;
            border: 1px solid #000;
            width: 150px;
            height: 33px;
            text-align: center;                 /* 水平居中 */
            /* 单行垂直居中，行高=高度 */
            line-height: 33px;
            margin: 8px;                        /* 间隔 */
            letter-spacing: 3px;                /* 字间距 */
        }
        .rB{
            color: #f00;
            font-weight: bold;
        }
        .dB{
            border: 1px dotted #036;          /* 虚线边框 */
        }
    </style>
</head>
<body>
    <h2>程柯昕的css选择器和属性</h2>
    <ul>
        <li class="rB">标签选择器</li>
        <li class="dB">ID选择器</li>
        <li class="rB">类选择器</li>
        <li>群组选择器</li>
        <li class="rB">后代选择器</li>
        <li class="rB dB">伪类选择器</li>
        <li class="dB">交集选择器</li>
    </ul>
</body>
</html>
