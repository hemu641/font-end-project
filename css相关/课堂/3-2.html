<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3{
            color: #f00;
            font-size: 50px;
        }
        p{
            color: #0f0;
            font-size: 20px;
        }
        #box{
            width: 600px;
            height: 400px;
            background-color: #aaa;
        }
        .blue{
            color: #00f;
            font-weight: bold;
        }
        .a{ 
            color: rgb(205, 249, 103);
            font-weight: bold;
        }
        .b{ 
            color: #f74ada;
            font-weight: bold;
        }
        h2{
            color: #fff;
            background-color: #000;
        }
        .s{
            font-size: 20px;
            color: #ff0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>层叠样式表CSS</h2>
    <div id="box">
        <h3>CSS选择器<span class="s">selector</span></h3>
        <p>内容与样式相分离</p>
        <p>内部CSS定义</p>
        <p class="blue">CSS属性和属性值</p>
        <p class="a">第四行文字</p>
        <p class="b">第五行文字</p>
    </div>
</body>
</html>

<!-- h \ p \超链接a \ span \ div \ al - li \ img -->
